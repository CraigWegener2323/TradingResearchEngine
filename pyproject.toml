[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-research-engine"
version = "0.1.0"
description = "A reproducible NQ and MNQ futures backtesting research engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<4.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=17.0,<25.0"]
dashboard = ["streamlit>=1.40,<2.0", "plotly>=5.24,<7.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
